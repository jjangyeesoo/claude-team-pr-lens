# PR과 main push에서 backend와 web을 검증한다. 실제 GitHub·Claude API는 호출하지 않는다 (비밀값 없음).
# job 이름 `backend`, `web`은 ruleset `Protect-main`의 필수 상태 체크 이름이다. 바꾸면 ruleset도 함께 바꾼다.
# `backend`는 세 OS 매트릭스(`backend-os`)의 판정 job이다. 매트릭스 job의 체크 이름은 `backend-os (ubuntu-latest)`처럼 OS가 붙어 바뀌므로 필수 체크로 쓸 수 없다.
# 두 job을 항상 실행한다. 경로 필터를 걸면 필수 체크가 "대기"로 남아 문서만 바꾼 PR을 머지할 수 없다.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # OS마다 한 번씩 전체 테스트를 실행한다 (요구사항 22.7). 한 OS가 실패해도 나머지 결과를 보려고 fail-fast를 끈다.
  backend-os:
    name: backend-os (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      # 포맷은 OS와 무관하므로 Linux에서만 확인한다. 로컬 Stop hook은 spotlessApply로 고치지만, CI는 고치지 않고 확인만 한다.
      - if: runner.os == 'Linux'
        run: ./gradlew spotlessCheck --console=plain
      - run: ./gradlew test --console=plain

  # ruleset의 필수 체크 이름 `backend`를 지키는 판정 job. 세 OS가 모두 성공할 때만 통과한다.
  # `if: always()`가 없으면 matrix가 실패했을 때 이 job이 건너뛰어져 필수 체크가 "대기"로 남는다.
  backend:
    needs: backend-os
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "backend-os: ${{ needs.backend-os.result }}"
          test "${{ needs.backend-os.result }}" = "success"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # `npm run verify`는 포맷을 고쳐 쓰므로 CI에서는 같은 단계를 확인 전용으로 실행한다.
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
